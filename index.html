<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unidade Secreta Live</title>
    <script>
      // Telas e chat do OBS: fundo transparente desde o primeiro frame, antes de qualquer CSS ou JS.
      if (/^\/(tela\/|chat$)/.test(location.pathname) && !/[?&]teste=1/.test(location.search))
        document.documentElement.classList.add('obs');
    </script>
    <style>
      html.obs,
      html.obs body,
      html.obs #root {
        background: transparent !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
