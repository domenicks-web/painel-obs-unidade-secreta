<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unidade Secreta · Painel da Live</title>
    <meta name="description" content="Painel da live da Unidade Secreta: telas do OBS, PIX e chat em tempo real." />
    <meta name="theme-color" content="#1A1417" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Telas e chat do OBS: fundo transparente desde o primeiro frame, antes de qualquer CSS ou JS.
      if (/^\/(tela\/|chat$)/.test(location.pathname) && !/[?&]teste=1/.test(location.search))
        document.documentElement.classList.add('obs');
    </script>
    <style>
      html.obs,
      html.obs body,
      html.obs #root {
        background: transparent !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
